<script>
// TEXTEN MET KOH SAMET
const texts = {
  en: "Only 200 meters from the beach. We offer 3 Comfort Rooms and 2 Family Rooms. The Family Room is a full apartment and can be rented entirely. Located close to the Koh Samet ferry, perfect for island trips.",
  
  nl: "Slechts 200 meter van het strand. Wij hebben 3 Comfort Rooms en 2 Family Rooms. De Family Room is een volledig appartement. Gelegen dichtbij de ferry naar Koh Samet, ideaal voor uitstapjes naar het eiland.",

};

function setLang(lang){
  document.getElementById("text").innerText = texts[lang];
}

setLang("en");

// SLIDER
function slider(name){
  let slides = document.querySelectorAll("." + name);
  let i=0;
  setInterval(()=>{
    slides[i].classList.remove("active");
    i=(i+1)%slides.length;
    slides[i].classList.add("active");
  },3000);
}

slider("hero-slide");
slider("room1");
slider("room2");
slider("bar");
slider("garden");
</script>
